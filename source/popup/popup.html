<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>繪師去哪了 助手</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <header>
      <h1>繪師去哪了</h1>
      <button id="btnRefresh" class="btn-refresh" title="重新偵測（清除快取）">↻</button>
    </header>

    <div id="statusBar" class="status-bar"></div>

    <div id="notProfilePage" class="message-box" style="display:none">
      <p>未偵測到個人頁面資料</p>
      <p style="font-size:0.7rem; margin-top:0.5rem; opacity:0.7">請確認你在繪師的個人頁面，並嘗試重新整理頁面 (Ctrl+Shift+R) 後再試一次。YouTube 等 SPA 網站在切換頁面後需要重新整理才能偵測。</p>
    </div>

    <div id="notLoggedIn" class="message-box" style="display:none">
      <p>請先在「繪師去哪了」網站登入</p>
      <a href="#" data-site target="_blank" rel="noopener" class="btn primary">前往登入</a>
    </div>

    <div id="profilePreview" style="display:none">
      <div class="profile-header">
        <div class="avatar-wrapper">
          <img id="previewAvatar" src="" alt="avatar">
        </div>
        <div class="name-field">
          <label for="previewName">繪師名稱</label>
          <input type="text" id="previewName" placeholder="繪師名稱">
        </div>
        <button id="btnSmartDetect" class="btn-smart btn-smart-top" title="智慧偵測所有內嵌連結">🔍 偵測全部</button>
      </div>

      <div id="existingBox" class="existing-box" style="display:none"></div>

      <div class="source-url">
        <span class="label">來源</span>
        <span id="previewUrl"></span>
      </div>

      <div class="type-picker" id="typePicker" role="group" aria-label="繪師類型">
        <div class="type-picker-title">繪師類型（可複選，不確定就不選）</div>
        <button type="button" class="type-btn" data-type="artist" aria-pressed="false">繪師</button>
        <button type="button" class="type-btn" data-type="coser" aria-pressed="false">Coser</button>
        <button type="button" class="type-btn" data-type="vtuber" aria-pressed="false">Vtuber</button>
        <button type="button" class="type-btn" data-type="craft" aria-pressed="false">手工藝／模型</button>
        <button type="button" class="type-btn" data-type="other" aria-pressed="false">其他</button>
      </div>

      <div class="actions">
        <button id="btnSubmit" class="btn primary">加入觀測</button>
        <button id="btnCancel" class="btn secondary">取消</button>
      </div>

      <div id="previewSection" class="collapsible-section" style="display:none">
        <div class="section-header">
          <button class="btn-collapse" data-target="previewBody">▼</button>
          <h3>將加入的連結 (<span id="previewCount">0</span>)</h3>
        </div>
        <div id="previewBody" class="section-body">
          <div id="previewList"></div>
        </div>
      </div>

      <div id="linksSection" class="collapsible-section">
        <div class="section-header">
          <button class="btn-collapse" data-target="linksBody">▼</button>
          <h3>偵測到的連結</h3>
        </div>
        <div id="linksBody" class="section-body">
          <div id="linksList"></div>
        </div>
      </div>
    </div>

    <div id="successView" class="message-box" style="display:none">
      <p class="success-text">已加入觀測！</p>
      <div id="addedBox" class="existing-box" style="display:none"></div>
      <a href="#" data-site target="_blank" rel="noopener" class="btn primary">前往查看</a>
    </div>

    <div id="nameChoiceView" class="message-box" style="display:none">
      <p>網站上已有可能是同一位的繪師，請核對後選擇：</p>
      <div id="nameChoiceList" class="name-choice-list"></div>
      <button id="btnNameCancel" class="btn secondary">取消</button>
    </div>

    <div id="errorView" class="message-box" style="display:none">
      <p id="errorText" class="error-text"></p>
      <button id="btnRetry" class="btn secondary">重試</button>
    </div>

    <div id="loading" class="message-box">
      <p>讀取中...</p>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
